name: demo_kit
description: Theme and app shell shared by the portfolio's Flutter demos.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    # Both under the SIL Open Font License 1.1, see fonts/OFL-*.txt. Bundled so the
    # demos load no fonts from Google's CDN. Inter is the latin subset.
    - family: Inter
      fonts:
        - asset: fonts/Inter-400.ttf
        - asset: fonts/Inter-500.ttf
          weight: 500
        - asset: fonts/Inter-600.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
