name: Demo reset

# Restores the public demo admin: migrations, fresh demo seed data and the
# read-only reviewer login. Secrets live on the `demo` environment.
#
# The nightly schedule is paused until the demo admin is deployed (see "Phase 1:
# what waits" in docs/checkpoints.md). When it goes live, restore:
#   schedule:
#     - cron: '17 2 * * *'
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-reset

jobs:
  reset:
    runs-on: ubuntu-latest
    environment: demo
    env:
      APP_ENV: demo
      DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
      PAYLOAD_SECRET: ${{ secrets.DEMO_PAYLOAD_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm --filter @mosaic/cms exec payload migrate
      - run: pnpm --filter @mosaic/cms exec payload run scripts/demo-reset.ts
