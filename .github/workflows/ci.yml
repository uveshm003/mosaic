name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mosaic
          POSTGRES_PASSWORD: mosaic
          POSTGRES_DB: mosaic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mosaic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgres://mosaic:mosaic@localhost:5432/mosaic_test
    steps:
      - uses: actions/checkout@v7
      # Installs Node from .nvmrc and pnpm from packageManager, then runs a frozen install.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Generated Payload files are up to date
        env:
          PAYLOAD_SECRET: ci-secret-that-is-at-least-32-chars
        run: |
          pnpm --filter @mosaic/cms generate:types
          pnpm --filter @mosaic/cms generate:importmap
          git diff --exit-code -- packages/content/src/payload-types.ts 'apps/cms/src/app/(payload)/admin/importMap.js'
      - run: pnpm build
      - name: Migrations match the schema
        env:
          PAYLOAD_SECRET: ci-secret-that-is-at-least-32-chars
        run: |
          pnpm --filter @mosaic/cms exec payload migrate:create drift --skip-empty
          if [ -n "$(git status --porcelain apps/cms/src/migrations)" ]; then
            echo "The schema changed without a migration. Run: pnpm --filter @mosaic/cms payload:dev migrate:create <name>"
            exit 1
          fi
      - name: Migrations build an empty database
        env:
          PAYLOAD_SECRET: ci-secret-that-is-at-least-32-chars
          DATABASE_URL: postgres://mosaic:mosaic@localhost:5432/mosaic_migrate
        run: |
          PGPASSWORD=mosaic psql -h localhost -U mosaic -d mosaic_test -c 'CREATE DATABASE mosaic_migrate'
          pnpm --filter @mosaic/cms exec payload migrate
      - name: Production build refuses seed data
        env:
          PAYLOAD_SECRET: ci-secret-that-is-at-least-32-chars
        run: |
          pnpm --filter @mosaic/cms exec payload run scripts/seed.ts
          pnpm --filter @mosaic/cms exec payload run scripts/export.ts
          if APP_ENV=production pnpm --filter @mosaic/site build > "$RUNNER_TEMP/build.log" 2>&1; then
            echo "A production build accepted a seeded snapshot"
            exit 1
          fi
          grep "Snapshot contains seed data" "$RUNNER_TEMP/build.log"
