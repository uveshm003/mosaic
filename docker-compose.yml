# Local Postgres for integration tests (mosaic_test, matching CI) and, until Neon
# is set up, local admin work (create mosaic_dev with `createdb`).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mosaic
      POSTGRES_PASSWORD: mosaic
      POSTGRES_DB: mosaic_test
    ports:
      - '5432:5432'
